{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Password Reset Sent</h3>
                </div>
                <div class="card-body text-center">
                    <p>We've sent you an email with instructions to reset your password.</p>
                    <p>If you don't receive an email, please check your spam folder.</p>
                    <div class="mt-3">
                        <a href="{% url 'accounts:login' %}" class="btn btn-primary">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
